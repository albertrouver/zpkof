function useItem(id) {
  const it = ITEMS[id];
  if (!it || !hasItem(id)) return;
  if (it.use === 'food') {
    removeItem(id, 1); stat('foodEaten'); sfx('eat');
    const ef = it.effect;
    const t = S.stats.playTime;
    let msg = `Tu manges : ${it.name}.`;
    if (ef.speed) { S.boosts.speed = t + ef.speed; msg += ' Vitesse boostée !'; }
    if (ef.jump) { S.boosts.jump = t + ef.jump; msg += ' Sauts boostés !'; }
    if (ef.catradar) { S.boosts.catradar = t + ef.catradar; msg += ' Radar à chats activé !'; }
    if (ef.magnet) { S.boosts.magnet = t + ef.magnet; msg += ' Aimant à pièces géant !'; }
    if (ef.xpboost) { S.boosts.xpboost = t + ef.xpboost; msg += ' XP ×1,5 !'; }
    if (ef.xp) { addXP(ef.xp); msg += ` +${ef.xp} XP.`; }
    if (ef.money) { give({ money: ef.money }, { silent: true }); msg += ` +${ef.money} 💰.`; }
    if (ef.tickets) { give({ tickets: ef.tickets }, { silent: true }); msg += ` +${ef.tickets} 🎟️.`; }
    if (ef.random) {
      const r = rndi(0, 4);
      if (r === 0) { S.boosts.speed = t + 90; msg += ' Effet : vitesse supersonique !'; }
      else if (r === 1) { addXP(80); msg += ' Effet : +80 XP d’un coup !'; }
      else if (r === 2) { give({ tickets: 40 }, { silent: true }); msg += ' Effet : pluie de tickets (+40) !'; }
      else if (r === 3) { addItem('banana', 1, true); msg += ' Effet : … une banane est apparue dans ta poche. Elle te regarde.'; }
      else { S.boosts.jump = t + 120; S.boosts.magnet = t + 120; msg += ' Effet : saut ET aimant. Le Multivers est généreux.'; }
    }
    toast(msg, { icon: it.icon, cls: 'cyan' });
  } else if (it.use === 'treasure') {
    const missing = Object.keys(EGGS).filter(k => !S.eggs[k]);
    const hints = shuffle(missing).slice(0, 3).map(k => `• ${EGGS[k].hint} (${EGGS[k].zone === 'any' ? 'partout' : ZONES[EGGS[k].zone] ? ZONES[EGGS[k].zone].name : EGGS[k].zone === 'menu' ? 'menu principal' : 'mini-jeu'})`);
    Dialog.show({ name: 'Carte au Trésor', icon: '🗺️', lines: [hints.length ? 'La carte révèle trois indices :\n' + hints.join('\n') : 'La carte est vierge : tu as trouvé tous les secrets. Chapeau.'] });
  } else if (it.use === 'vinylmystery') {
    const locked = SONGS.filter(s => !S.songs[s.id] && s.id !== 'serenade' && s.id !== 'boss');
    removeItem(id, 1);
    if (!locked.length) { give({ tickets: 150 }, { label: 'Tu avais déjà tout ! Madame Tickette te rembourse.' }); }
    else { const s = pick(locked); unlockSong(s.id); showUnlock({ kind: 'Vinyle Mystère', icon: '💿', name: s.name, desc: `Ambiance « ${s.mood} ». Disponible au jukebox !`, rarity: s.rarity }); }
  } else if (it.costume) { S.costume = it.costume; toast(`Costume équipé : ${it.name}`, { icon: it.icon, cls: 'cyan' }); }
  else if (it.song) { Music.paused = false; Music.play(it.song, { restart: true }); toast(`Lecture : ${SONG_BY_ID[it.song].name}`, { icon: '🎵' }); }
  Progress.dirty = true;
  updateHUD();
}
function buyItem(id, currency) {
  const it = ITEMS[id];
  const price = currency === 'tickets' ? it.tprice : it.price;
  if (!price) return false;
  const owned = (it.cat === 'deco' || it.cat === 'cosmetic') && hasItem(id);
  if (owned) { toast('Tu l’as déjà !', { icon: '✔' }); return false; }
  if (!spend(currency === 'tickets' ? 'tickets' : 'money', price)) { sfx('error'); toast(currency === 'tickets' ? 'Pas assez de tickets 🎟️' : 'Pas assez de pièces 💰', { icon: '😬', cls: 'red' }); return false; }
  sfx('buy'); stat('itemsBought');
  if (it.costume) grantCostume(it.costume);
  else if (it.deco) grantDeco(it.deco);
  else addItem(id, 1);
  Progress.dirty = true;
  return true;
}
// =====================================================================
// UI — toasts, cartes de déblocage, HUD, dialogues
// =====================================================================
function toast(text, o = {}) {
  const box = $('#toasts');
  const max = window.innerWidth < 700 || window.innerHeight < 500 ? 3 : 4;
  while (box.children.length >= max) box.firstChild.remove();
  const el = h('div', { class: 'toast ' + (o.cls || '') }, h('div', { class: 'ti' }, o.icon || 'ℹ️'), h('div', null, h('div', null, text), o.sub ? h('small', null, o.sub) : null));
  box.append(el);

        c.stroke();
      }

      const guesses = names.map(n => [n, pick(GRIFFO_GUESSES)]);

  },

function playEnding(id, replay = false, after = null) {
  const e = ENDINGS.find(x => x.id === id);
  Scene.play({ bg: id === 'secret' || id === 'collector' ? 'cloud' : id === 'creator' ? 'studio' : id === 'explorer' ? 'fortnite' : 'core', title: e.name, lines: ENDING_SCENES[id] }, () => {
    if (!replay) {
      const fresh = !S.endings[id];
      S.endings[id] = S.endings[id] || Date.now();
      if (id === 'secret') andalouseMoment('ending');
      if (fresh) grantCostume('golden');
      if (id === 'secret') grantCostume('cloud');
      S.freeMode = true;
      Progress.dirty = true; Save.save(true);
    }
    if (after) after();
  });
}
function showEndRewards(e, first, next) {
  const items = [
    [e.icon, `Fin obtenue : ${e.name}`, e.desc],
    ['☁️', 'Nouvelle zone : Le Cloud d’Algator', 'Un nouveau portail est apparu dans le Hub (et sur la carte).'],
    ['✨', 'Mode libre débloqué', 'Toutes les zones sont accessibles, tous les mini-jeux sont rejouables depuis le menu.'],
    ['💠', 'Objet secret : Cœur du Multivers', 'Il bat au rythme de 37 univers. Expose-le dans ton studio !'],
    ['🔮', 'Personnage secret : l’Algator Primordial', 'Il t’attend au sommet du Cloud…'],
    ['🌟', 'Costume : Algator Doré', 'Brille dans le noir. Et en plein jour.'],
    ['👑', 'Trône du Multivers', 'Dans le Cloud, affronte à nouveau le boss pour découvrir les autres fins.'],
  ];
  Panel.show({ title: first ? 'Récompenses de victoire !' : 'Nouvelle victoire !', icon: '🏆', onClose: () => next && next(), render(body, tab, foot) {
    body.append(h('div', { class: 'note' }, `Victoire n°${S.bossWins} contre ALGATOR.EXE · Fins découvertes : ${Object.keys(S.endings).length}/${ENDINGS.length}`));
    body.append(h('div', { class: 'list', style: { marginTop: '12px' } }, (first ? items : items.slice(0, 1).concat([items[6]])).map(([ic, t1, t2]) => h('div', { class: 'li' }, h('div', { class: 'lic' }, ic), h('div', { class: 'lim' }, h('b', null, t1), h('span', null, t2))))));
    const nextE = ENDINGS.filter(x => !S.endings[x.id]);
    if (nextE.length) body.append(h('div', { class: 'note', style: { marginTop: '12px' } }, `Fins restantes : ${nextE.map(x => x.name.split(' —')[0]).join(', ')}. Indice pour la suivante : ${nextE[0].hint}`));
    foot.append(h('button', { class: 'btn primary big', on: { click: () => Panel.close() } }, 'Continuer ▶'));
  } });
}
function playCredits(after) {
  const lines = CREDITS.map(([a, b]) => ['narr', b ? `${a} ${b}` : a]);
  lines.push(['algator', 'Merci d’avoir joué. À bientôt dans le Multivers !', 'dance']);
  Scene.play({ bg: 'credits', title: 'Générique', lines: lines.concat([]), }, after || null);
  Scene.actors = ['yanis', 'sharkz', 'peter', 'algator', 'oligator', 'alessia', 'footastique'];
}

// =====================================================================
// MAIN — menu principal, boucle de jeu, démarrage
// =====================================================================
const Game = {
  mode: 'loading', last: 0, autosaveT: 0, fpsT: 0, frames: 0,
  blocked() { return Dialog.open || Panel.open || !!MGHost.active || Scene.active || Confirm.open || Unlock.open || Photo.active; },
  toMenu() {
    if (S && S.started && this.mode === 'world') Save.save(true);
    if (Photo.active) Photo.close();
    this.mode = 'menu';
    if (Dialog.open) Dialog.close();
    if (Panel.open) Panel.close();
    World.challenge = null; $('#challengeBox').classList.add('hidden');
    $('#hud').classList.add('hidden'); $('#menu').classList.remove('hidden'); $('#prompt').classList.add('hidden');
    applyAccessibility(); updateTouchVisibility(); updateMenuSave();
    Music.paused = false; Music.play('theme');
  },
  newGame() {
    const go = () => {
      const keep = S && S.settings ? { ...S.settings } : null;
      S = defaultState(); S.started = true; S.stats.sessions = 1;
      if (keep) S.settings = { ...S.settings, ...keep };
      Save.save(true);
      this.mode = 'world';
      $('#menu').classList.add('hidden');
      Scene.play(SCENES.intro, () => {
        S.introSeen = true;
        this.enterWorld();
        setTimeout(() => toast(Input.usingTouch || isTouchDevice() ? 'Utilise le joystick (à gauche) pour bouger, et le bouton E pour interagir.' : 'Déplace-toi avec ZQSD / WASD / flèches. Approche-toi de l’ordinateur et appuie sur E.', { icon: '🎮', cls: 'cyan', dur: 6000 }), 600);
      });
    };
    if (Save.has()) Confirm.ask('Commencer une nouvelle partie ? Ta sauvegarde actuelle sera remplacée (pense à l’exporter dans Paramètres).', go, { danger: true, yesLabel: 'Nouvelle partie' });
    else go();
  },
  continueGame() {
    if (!Save.load()) { toast('Aucune sauvegarde trouvée.', { icon: '💾', cls: 'red' }); return; }
    stat('sessions');
    this.enterWorld(true);
    toast(`Bon retour, ${levelTitle()} !`, { icon: '🐊', cls: 'cyan' });
  },
  startFromSave() { if (this.mode === 'world') this.enterWorld(true); else updateMenuSave(); },
  enterWorld(restorePos = false) {
    this.mode = 'world';
    AU.applyVolumes(); applyAccessibility(); applyTitle();
    $('#fps').classList.toggle('hidden', !S.settings.fps);
    $('#menu').classList.add('hidden'); $('#hud').classList.remove('hidden');
    const pos = restorePos && S.px != null ? { x: S.px, y: S.py } : null;
    World.load(S.zone || 'studio', null, pos);
    onEnterZone(S.zone || 'studio', null);
    hudCache = {};
    updateHUD(); updateQuestTracker(); updateTouchVisibility();
    Progress.dirty = true;
  },
};
function updateMenuSave() {
  const el = $('#menuSave'), btn = $('#btnContinue');
  const s = Save.available ? Save.peek() : null;
  if (s && s.started) { el.textContent = `💾 Sauvegarde : niveau ${s.level} · ${fmtTime(s.stats.playTime)} · ${ZONES[s.zone] ? ZONES[s.zone].name : ''} · ${Object.keys(s.cats || {}).length} chats${ngCycleOf(s) ? ` · NG+${ngCycleOf(s)}` : ''}`; btn.disabled = false; }
  else { el.textContent = Save.available ? 'Aucune sauvegarde pour l’instant.' : '⚠️ Stockage local indisponible : utilise l’export de sauvegarde.'; btn.disabled = true; }
  const ngBtn = $('#btnNgp');
  if (ngBtn) ngBtn.classList.toggle('hidden', !(s && s.started && (s.bossWins > 0 || ngCycleOf(s) > 0)));
  const th = MENU_THEMES[menuThemeId()], t1 = $('#menuTitle .t1');
  if (t1) { t1.style.color = th.col; t1.style.textShadow = `0 0 10px ${th.col}, 0 0 36px ${hexA(th.col, 0.45)}, 4px 4px 0 rgba(0,0,0,.5)`; }
  const t2 = $('#menuTitle .t2'); if (t2) { t2.style.color = th.sub || ''; t2.style.textShadow = th.sub ? 'none' : ''; }
  applyTitle();
}

// ---------- Fond animé du menu ----------
const MenuBG = {
  t: 0, icons: [], cat: null, catT: 8,
  init() {
    const set = ['🎮', '🎵', '🎬', '🐱', '🏗️', '💠', '🔴', '🧦', '⚽', '🎤', '🕹️', '📼', '🖍️', '🕵️', '🥐', '🏁', '🚗', '☁️'];
    this.baseIcons = set;
    this.icons = Array.from({ length: 26 }, (_, i) => ({ e: set[i % set.length], x: Math.random(), y: Math.random(), s: rnd(0.5, 1.2), p: rnd(TAU) }));
    const cv = $('#menuBg');
    cv.addEventListener('click', e => {
      if (!this.cat) return;
      const r = cv.getBoundingClientRect();
      if (Math.hypot(e.clientX - r.left - this.cat.x, e.clientY - r.top - this.cat.y) < 30) {
        if (S && S.started) { if (findCat('menu')) { this.cat = null; Save.save(true); } }
        else toast('Un chat ! Commence une partie pour pouvoir l’attraper.', { icon: '🐈' });
      }
    });
  },
  draw(dt) {
    this.t += dt;
    const cv = $('#menuBg'), dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, H = window.innerHeight;
    if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const t = this.t;
    const th = MENU_THEMES[this.themeId || 'classic'] || MENU_THEMES.classic;
    this.themeCheck = (this.themeCheck || 0) - dt;
    if (this.themeCheck <= 0) { this.themeCheck = 1; const id = menuThemeId(); if (id !== this.themeId) { this.themeId = id; this.icons.forEach((ic, i) => { ic.e = (MENU_THEMES[id].icons || this.baseIcons)[i % (MENU_THEMES[id].icons || this.baseIcons).length]; }); updateMenuSave(); } }
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, th.g[0]); g.addColorStop(0.6, th.g[1]); g.addColorStop(1, th.g[2]); c.fillStyle = g; c.fillRect(0, 0, W, H);
    const hz = H * 0.62;
    c.save(); c.globalAlpha = 0.18; c.fillStyle = th.sun; c.beginPath(); c.arc(W / 2, hz, Math.min(W, H) * 0.32, Math.PI, 0); c.fill(); c.restore();
    c.strokeStyle = `rgba(${th.grid},.35)`; c.lineWidth = 1;
    for (let i = 0; i < 18; i++) { const k = ((i + (t * 0.6) % 1) / 18); const y = hz + Math.pow(k, 2) * (H - hz); c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    for (let i = -14; i <= 14; i++) { c.beginPath(); c.moveTo(W / 2 + i * 22, hz); c.lineTo(W / 2 + i * 160, H); c.stroke(); }
    for (const ic of this.icons) { const x = ((ic.x * W + t * 12 * ic.s) % (W + 80)) - 40; const y = ic.y * hz * 0.95 + Math.sin(t * ic.s + ic.p) * 14; drawEmoji(c, ic.e, x, y, 18 + ic.s * 16, 0.35); }
    const s = clamp(H / 210, 1.4, 3.4);
    const cos = th.costume && S && S.inv && S.inv['cos_' + th.costume] ? th.costume : (S && S.started ? S.costume : 'default');
    drawCharacter(c, 'algator', W / 2, H * 1.0, s, { t, anim: 'dance', facing: Math.sin(t * 0.5) > 0 ? 1 : -1, costume: cos });
    drawCharacter(c, th.left, W * 0.2, H * 0.95, s * 0.7, { t: t + 1, anim: 'dance', facing: 1 });
    drawCharacter(c, th.right, W * 0.8, H * 0.95, s * 0.7, { t: t + 2, anim: 'idle', facing: -1 });
    if (th.tag) { c.save(); c.font = 'bold 12px "Trebuchet MS",sans-serif'; c.textAlign = 'center'; c.fillStyle = th.sub || hexA(th.col, 0.85); c.fillText(th.tag, W / 2, H - 10 - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sb')) || 0)); c.restore(); }
    // le chat du menu principal passe parfois…
    this.catT -= dt;
    if (!this.cat && this.catT <= 0 && !(S && S.cats && S.cats.menu)) { this.cat = { x: -30, y: H * rnd(0.3, 0.55), vx: rnd(60, 110) }; this.catT = rnd(18, 30); }
    if (this.cat) { this.cat.x += this.cat.vx * dt; drawCat(c, this.cat.x, this.cat.y, 1.5, CAT_BY_ID.menu, { t, facing: 1, anim: 'run' }); if (this.cat.x > W + 40) this.cat = null; }
  },
};
const MENU_TAGS = ['Choisis le titre du jeu dans Paramètres → Titre du jeu.', `Maintenant avec ${CATS.length} chats (dont un qui ne sort que la nuit).`, 'Nouveau : le Défi du jour, le mode photo (P) et l’Atelier Parkour.', 'Les vraies maps Fortnite d’Algator37 sont cachées dans le Monde Fortnite.', '100 % crocodile, 0 % serveur.', 'Ne pas appuyer sur le bouton inutile. (Appuie.)', 'Toutes les musiques sont jouées en direct par le synthé du jeu.', 'Le Multivers t’attend. Oligator aussi.', 'Griffophone · Alibito · et plein de références cachées.', 'Astuce : certains murs ne sont pas des murs.'];
function setupMenu() {
  MenuBG.init();
  let tagI = 0; const tag = $('#menuTag');
  const rot = () => { tag.textContent = MENU_TAGS[tagI++ % MENU_TAGS.length]; }; rot(); setInterval(rot, 4200);
  let logoClicks = 0;
  $('#menuTitle').addEventListener('click', () => {
    AU.init(); sfx('boing'); logoClicks++;
    const t = $('#menuTitle .t1'); t.style.transform = `rotate(${rnd(-6, 6)}deg) scale(1.05)`; setTimeout(() => t.style.transform = '', 150);
    if (logoClicks === 7) { if (S && S.started) { findEgg('logo7'); Save.save(true); } else toast('Le logo glousse. Commence une partie pour débloquer ce secret !', { icon: '✨' }); }
  });
  $$('[data-menu]').forEach(b => b.addEventListener('click', () => {
    AU.init(); sfx('click');
    const a = b.dataset.menu;
    if (a === 'play') Game.newGame();
    else if (a === 'continue') Game.continueGame();
    else if (a === 'ngplus') { if (Save.load()) askNewGamePlus(); }
    else ({ daily: () => DailyCh.open(), parkour: () => PkEdit.open(), collection: openCollection, minigames: openMinigamesPanel, quests: openQuestsPanel, characters: openCharacters, music: openMusicPanel, stats: openStatsPanel, settings: openSettings }[a] || (() => {}))();
  }));
}

// ---------- Clavier global ----------
function onGlobalKey(e) {
  if (Unlock.open && ['Space', 'Enter', 'KeyE', 'Escape', 'NumpadEnter'].includes(e.code)) { Unlock.dismiss(); Input.edges.clear(); return; }
  if (Confirm.open) { if (e.code === 'Escape') Confirm.close(); return; }
  if (Scene.active) { if (['Space', 'Enter', 'KeyE', 'NumpadEnter'].includes(e.code)) Scene.advance(); else if (e.code === 'Escape') Scene.skip(); Input.edges.clear(); return; }
  if (MGHost.active) {
    if (e.code === 'Escape') { if (MGHost.state === 'play') MGHost.pause(); else if (MGHost.state === 'paused') MGHost.resume(); else MGHost.quit(); }
    else if (MGHost.state === 'intro' && e.code === 'Enter') MGHost.start();
    return;
  }
  if (Dialog.open) { if (Dialog.key(e)) Input.edges.clear(); return; }
  if (Panel.open) { if (e.code === 'Escape') { Panel.close(); } return; }
  if (Photo.active) { const shot = $('#photoShot'); if (!shot.classList.contains('hidden') && (e.code === 'Escape' || e.code === 'Space' || e.code === 'Enter')) { shot.classList.add('hidden'); Input.edges.clear(); return; } Photo.key(e); Input.edges.clear(); return; }
  if (Game.mode !== 'world') return;
  const k = (e.key || '').toLowerCase();
  if (e.code === 'Escape') openPause();
  else if (e.code === 'KeyP') Photo.open();
  else if (k === 'm') openMap();
  else if (k === 'j') openQuestsPanel();
  else if (k === 'i') openInventory();
  else if (k === 'c') openCollection();
}
function onAutoPause() {
  if (!S) return;
  if (Photo.active) Photo.close();
  if (MGHost.active && MGHost.state === 'play') MGHost.pause();
  else if (Game.mode === 'world' && !Game.blocked()) openPause();
  if (S.started) Save.save(true);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { onAutoPause(); AU.suspend(); }
  else AU.resume();
});
window.addEventListener('beforeunload', () => { if (S && S.started && Game.mode === 'world') Save.save(true); });

// ---------- Erreurs ----------
const seenErrors = new Set();
function showError(err) {
  const msg = (err && (err.message || err.reason && err.reason.message)) || String(err);
  console.error(err);
  if (seenErrors.has(msg)) return; seenErrors.add(msg);
  let box = $('#errBox');
  if (!box) { box = h('div', { id: 'errBox' }); document.getElementById('app').append(box); }
  box.innerHTML = '';
  box.append(h('b', null, '🐛 Un bug du Multivers est apparu'), h('div', { class: 'muted', style: { margin: '4px 0' } }, msg), h('button', { class: 'btn small', on: { click: () => box.remove() } }, 'Continuer'));
}
window.addEventListener('error', e => showError(e.error || e.message));
window.addEventListener('unhandledrejection', e => showError(e.reason || 'Promesse rejetée'));

// ---------- Boucle principale ----------
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - Game.last) / 1000 || 0));
  Game.last = ts;
  try {
    Pad.poll(dt);
    if (Game.mode === 'menu' && !MGHost.active) MenuBG.draw(dt);
    if (S && S.started && !document.hidden && (Game.mode === 'world' || MGHost.active)) S.stats.playTime += dt;
    if (MGHost.active) MGHost.frame(dt);
    else if (Scene.active) Scene.update(dt);
    else if (Game.mode === 'world' && World.z) {
      if (!Game.blocked()) updateWorld(dt);
      else { World.time += dt; if (Photo.active) Photo.update(dt); if (Dialog.open) { if (Input.pressed('jump') || Input.pressed('interact')) Dialog.advance(); } }
      drawWorld();
      Dialog.update(dt);
      Progress.tick(dt);
      Game.autosaveT += dt;
      if (Game.autosaveT > 30) { Game.autosaveT = 0; Save.save(true); }
    }
    if (Game.mode === 'menu' && Dialog.open) Dialog.update(dt);
    if (S && S.settings.fps) { Game.frames++; Game.fpsT += dt; if (Game.fpsT >= 0.5) { $('#fps').textContent = `${Math.round(Game.frames / Game.fpsT)} FPS`; Game.frames = 0; Game.fpsT = 0; } }
  } catch (err) { showError(err); }
  Input.endFrame();
  requestAnimationFrame(frame);
}

// ---------- Démarrage ----------
async function boot() {
  const bar = $('#loadBar'), tip = $('#loadTip');
  const steps = [
    ['Préparation des données de l’univers…', () => {
      COLLECT_ITEM_IDS = Object.keys(ITEMS).filter(k => ['quest', 'food', 'useless', 'rare', 'secret'].includes(ITEMS[k].cat));
      MG_REGULAR = MG_ORDER.filter(id => id !== 'boss' && MG_DEFS[id]);
      Save.test();
      if (Save.has()) Save.load(); else { S = defaultState(); loadPrefs(); }
      applyAccessibility(); applyTitle();
    }],
    [`Génération des cartes des ${ZONE_ORDER.length} zones…`, () => { for (const id of ZONE_ORDER) parseZone(id); }],
    [`Accordage du synthé (${SONGS.length} musiques)…`, () => { for (const s of SONGS) Music.build(s); }],
    ['Réveil des chats…', () => {}],
    ['Calibration du bouton inutile…', () => {}],
    ['Ouverture du Multivers…', () => { World.init(); MGHost.init(); Scene.init(); setupTouch(); Photo.init(); Pad.init(); buildHUD(); setupMenu(); updateHUD(); }],
  ];
  for (let i = 0; i < steps.length; i++) {
    tip.textContent = steps[i][0];
    try { steps[i][1](); } catch (err) { showError(err); }
    bar.style.width = ((i + 1) / steps.length * 100) + '%';
    await wait(110);
  }
  tip.textContent = pick(['Astuce : parle à tout le monde, même aux panneaux.', 'Astuce : Maj pour courir, Espace pour sauter par-dessus les haies.', 'Astuce : les chats trouvés viennent vivre dans ton studio.', 'Astuce : certains murs ne sont pas des murs…', 'Astuce : la carte (M) indique les missions disponibles.']);
  const go = $('#loadGo'); go.classList.remove('hidden');
  const start = () => {
    AU.init();
    $('#loading').classList.add('hidden');
    Game.toMenu();
    requestAnimationFrame(ts => { Game.last = ts; requestAnimationFrame(frame); });
  };
  go.addEventListener('click', start, { once: true });
}
boot();
</script>
