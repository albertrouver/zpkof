<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Banger Boxe : mini-jeu de L'Empire Banger V3. Fichier autonome (la photo est incluse), à déposer tel quel. -->
<title>Banger Boxe · L'Empire Banger V3</title>
<meta name="description" content="Mini-jeu de L'Empire Banger V3 : frappe le sac, enchaîne les combos, mets les sacs K.O. et monte les rounds.">
<meta name="theme-color" content="#07000d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --p:#b026ff; --s:#ff2e9a; --bg:#07000d; --gold:#ffd700; --panel:#17021f; --panel-2:#22042d;
  --text:#fff; --doux:rgba(255,255,255,.64); --green:#39ff6a; --rouge:#ff3b4f; --ligne:rgba(255,255,255,.1);
  --h:clamp(300px, 50vh, 430px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{
  min-height:100vh; padding:14px 16px 90px; color:var(--text); background:var(--bg);
  font-family:'Nunito',system-ui,sans-serif;
  background-image:radial-gradient(circle at 12% 10%,rgba(176,38,255,.16) 0%,transparent 45%),radial-gradient(circle at 88% 90%,rgba(255,46,154,.13) 0%,transparent 45%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- en-tête ---------- */
.entete{max-width:1060px;margin:0 auto 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{flex:1; margin:0; font:400 clamp(2rem,7vw,2.9rem) 'Bangers',Impact,sans-serif; letter-spacing:3px; line-height:1}
/* le dégradé seulement sur le texte : appliqué à l'emoji, il le transforme en tache */
h1 .degrade{background:linear-gradient(135deg,var(--gold),#ffae00 45%,var(--s)); -webkit-background-clip:text; background-clip:text; color:transparent}
h1 small{display:block;font-size:.38em;letter-spacing:2px;color:var(--doux)}
.retour{
  text-decoration:none; color:var(--text); font-weight:900; font-size:.78rem; letter-spacing:1px;
  padding:7px 12px; border-radius:999px; border:1.5px solid var(--ligne); background:rgba(255,255,255,.05); white-space:nowrap;
}
.retour:hover{border-color:var(--p)}
.btn-rond{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ligne);background:var(--panel);font-size:1.15rem;cursor:pointer}
.btn-rond:hover{border-color:var(--p)}

/* ---------- mise en page ---------- */
.jeu{max-width:1060px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
@media (max-width:820px){.jeu{grid-template-columns:minmax(0,1fr)}}
.panneau{background:var(--panel);border:1.5px solid var(--ligne);border-radius:18px;padding:14px}
h2{font:400 1.35rem 'Bangers',Impact,sans-serif;letter-spacing:2px;color:var(--gold);margin:0 0 10px}
h2:not(:first-child){margin-top:18px}

/* ---------- compteur ---------- */
.compteur{text-align:center}
#likes{font:400 clamp(2.4rem,9vw,3.4rem) 'Bangers',Impact,sans-serif;letter-spacing:2px;line-height:1;color:var(--gold);text-shadow:0 0 18px rgba(255,215,0,.35)}
.unite{font-weight:900;text-transform:uppercase;letter-spacing:3px;font-size:.72rem;color:var(--doux)}
#lps{font-weight:800;font-size:.85rem;color:var(--green);margin-top:3px}

/* ---------- round et vie du sac ---------- */
.ligne-round{display:flex;align-items:center;gap:12px;margin-top:12px}
.round{font:400 1.3rem 'Bangers',Impact,sans-serif;letter-spacing:1.5px;color:var(--gold);white-space:nowrap;line-height:1.1}
.round small{display:block;font:800 .72rem 'Nunito',sans-serif;letter-spacing:0;color:var(--doux)}
.pv{position:relative;flex:1;height:24px;border-radius:999px;background:rgba(0,0,0,.45);border:1.5px solid var(--ligne);overflow:hidden}
.pv i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,var(--rouge),#ff8a3d 60%,var(--gold));transition:width .12s ease-out}
.pv span{position:relative;display:block;text-align:center;font-weight:900;font-size:.78rem;line-height:21px;text-shadow:0 1px 2px #000}
.boss .pv i{background:linear-gradient(90deg,#77778a,#d8d8e0)}
.boss .round{color:#d8d8e0}

/* ---------- le ring ---------- */
#ring{
  position:relative; display:block; width:100%; height:var(--h); margin:10px 0; padding:0; cursor:pointer;
  border:2px solid rgba(255,46,154,.35); border-radius:18px; overflow:hidden;
  background:
    radial-gradient(ellipse 60% 55% at 50% 0%,rgba(255,215,0,.17),transparent 70%),
    linear-gradient(180deg,#1b0426 0%,#10021a 72%,#2a0838 72%,#170320 100%);
  touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
#ring:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.cordes{
  position:absolute; inset:0; pointer-events:none; opacity:.55;
  background:
    linear-gradient(90deg,var(--s),var(--p)) 0 44%/100% 5px no-repeat,
    linear-gradient(90deg,var(--s),var(--p)) 0 56%/100% 5px no-repeat,
    linear-gradient(90deg,var(--s),var(--p)) 0 68%/100% 5px no-repeat;
}
/* le sac se place juste devant le poing avant du champion, quelle que soit la largeur du ring */
#sac-wrap{
  position:absolute; top:0; height:80%; aspect-ratio:120/300; z-index:1;
  left:max(4%, calc(100% + 26px - var(--h) * .95));
  --sac-clair:#ff5a6e; --sac-fonce:#8e0f24;
}
#sac{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 0}
.s-clair{stop-color:var(--sac-clair)}
.s-fonce{stop-color:var(--sac-fonce)}
.sac-marque{font:400 22px 'Bangers',Impact,sans-serif;fill:var(--gold);letter-spacing:1px}
.fissures{display:none}
.boss .fissures{display:inline}
/* la photo est coupée à droite (le bras) : on la fait déborder du ring pour cacher la coupe */
#champion{
  position:absolute; right:-26px; bottom:0; height:94%; width:auto; z-index:2; pointer-events:none;
  filter:drop-shadow(0 0 16px rgba(176,38,255,.55)) drop-shadow(0 6px 0 rgba(0,0,0,.35));
}
#effets{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.astuce{
  position:absolute; left:50%; bottom:10px; z-index:4; transform:translateX(-50%);
  font:400 .95rem 'Bangers',Impact,sans-serif; letter-spacing:1.5px; white-space:nowrap;
  padding:5px 13px; border-radius:999px; background:rgba(0,0,0,.6); color:var(--gold);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.55}}

/* ---------- effets de coup ---------- */
.flottant{
  position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
  font:400 1.5rem 'Bangers',Impact,sans-serif; letter-spacing:1px; color:var(--green);
  text-shadow:0 2px 0 #000,0 0 10px rgba(57,255,106,.6); animation:monte .9s ease-out forwards;
}
.flottant.crit{color:var(--gold);font-size:2.1rem;text-shadow:0 2px 0 #000,0 0 14px rgba(255,215,0,.7)}
@keyframes monte{from{transform:translate(-50%,-50%) scale(.8);opacity:1}to{transform:translate(-50%,-50%) translateY(-70px) scale(1.1);opacity:0}}
.boum{
  position:absolute; width:86px; height:86px; display:grid; place-items:center;
  font:400 1.2rem 'Bangers',Impact,sans-serif; letter-spacing:1px; color:#1a0020; background:var(--gold);
  clip-path:polygon(50% 0,61% 30%,95% 18%,72% 48%,100% 70%,64% 68%,58% 100%,44% 72%,8% 92%,28% 60%,0 36%,34% 34%);
  transform:translate(-50%,-50%) rotate(var(--r,0deg)); animation:boum .38s ease-out forwards;
}
.boum.crit{width:120px;height:120px;font-size:1.25rem;background:linear-gradient(135deg,var(--gold),var(--s));color:#fff;text-shadow:0 1px 0 #000}
@keyframes boum{
  0%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(.3);opacity:1}
  60%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.08);opacity:1}
  100%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1);opacity:0}
}
.ko-texte{
  position:absolute; left:50%; top:40%; transform:translate(-50%,-50%) rotate(-4deg); white-space:nowrap;
  font:400 clamp(3rem,14vw,5.5rem) 'Bangers',Impact,sans-serif; letter-spacing:4px; color:var(--gold);
  text-shadow:4px 4px 0 var(--s),0 0 30px rgba(255,215,0,.6); animation:ko 1.1s ease-out forwards;
}
@keyframes ko{
  0%{transform:translate(-50%,-50%) scale(2.2) rotate(-8deg);opacity:0}
  18%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}
  75%{opacity:1}
  100%{transform:translate(-50%,-60%) scale(1.05) rotate(-4deg);opacity:0}
}

/* ---------- combo et titre ---------- */
.combo-ligne{display:flex;align-items:center;gap:10px}
#combo-texte{font:400 1.05rem 'Bangers',Impact,sans-serif;letter-spacing:1px;color:var(--s);min-width:13ch;white-space:nowrap}
.barre{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--s))}
.titre-rang{margin-top:12px;font-weight:900}
.titre-rang small{display:block;font-weight:700;color:var(--doux);font-size:.76rem}

/* ---------- boutique ---------- */
.amelio{
  display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:10px; align-items:center; width:100%; text-align:left;
  padding:9px 11px; margin-bottom:8px; border-radius:14px; border:1.5px solid var(--ligne); background:var(--panel-2); cursor:pointer;
}
.amelio .ico{font-size:1.55rem;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:rgba(0,0,0,.35)}
.amelio .nom{display:block;font-weight:900;font-size:.95rem}
.amelio .desc{display:block;font-size:.76rem;color:var(--doux);line-height:1.3}
.amelio .cote{text-align:right}
.amelio .prix{display:block;font:400 1.15rem 'Bangers',Impact,sans-serif;letter-spacing:1px;color:var(--gold);white-space:nowrap}
.amelio .niv{display:block;font-size:.72rem;font-weight:800;color:var(--doux);white-space:nowrap}
.amelio.pret{border-color:rgba(255,215,0,.55);box-shadow:inset 0 0 0 1px rgba(255,215,0,.15)}
.amelio.pret:hover{background:#2c0639}
.amelio.cher{opacity:.5;cursor:not-allowed}
.verrou{padding:10px 12px;border-radius:14px;border:1.5px dashed var(--ligne);color:var(--doux);font-size:.8rem;font-weight:800}

/* ---------- stats ---------- */
#stats{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin:0 0 14px;font-size:.88rem}
#stats dt{color:var(--doux);font-weight:700}
#stats dd{margin:0;font-weight:900;text-align:right}
.btn-reset{width:100%;padding:9px 12px;border-radius:12px;border:1.5px solid var(--ligne);background:transparent;color:var(--doux);font-weight:800;font-size:.82rem;cursor:pointer}
.btn-reset.arme{border-color:var(--rouge);color:var(--rouge)}
.note{max-width:1060px;margin:14px auto 0;font-size:.76rem;color:var(--doux);text-align:center}

/* ---------- notifications ---------- */
#toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;width:min(calc(100vw - 32px),420px);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{
  background:linear-gradient(135deg,var(--p),var(--s)); color:#fff; font-weight:900; font-size:.9rem; text-align:center;
  padding:10px 16px; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.45);
  animation:arrive .25s ease-out; transition:opacity .35s,transform .35s;
}
.toast.part{opacity:0;transform:translateY(8px)}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}}

@media (prefers-reduced-motion: reduce){
  .flottant,.boum,.ko-texte{animation-name:fondu !important}
  .astuce{animation:none}
  .toast{animation:none}
}
@keyframes fondu{from{opacity:1}to{opacity:0}}
</style>
</head>
<body>

<header class="entete">
  <a class="retour" href="https://algator37.neocities.org/">🐊 L'EMPIRE BANGER</a>
  <h1><span aria-hidden="true">🥊</span> <span class="degrade">BANGER BOXE</span><small>MINI-JEU · L'EMPIRE BANGER V3</small></h1>
  <button class="btn-rond" id="btn-son" type="button" aria-pressed="true" title="Couper le son">🔊</button>
</header>

<main class="jeu">
  <section class="panneau" id="col-ring">
    <div class="compteur">
      <div id="likes">0</div>
      <div class="unite">likes</div>
      <div id="lps">0 like/s</div>
    </div>

    <div class="ligne-round">
      <div class="round" id="round">ROUND 1<small>Sac rouge</small></div>
      <div class="pv" id="pv" role="progressbar" aria-label="Vie du sac" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <i id="pv-barre"></i><span id="pv-texte">12 / 12</span>
      </div>
    </div>

    <button id="ring" type="button" aria-label="Frapper le sac (touche Espace)">
      <span class="cordes" aria-hidden="true"></span>
      <span id="sac-wrap" aria-hidden="true">
        <svg id="sac" viewBox="0 0 120 300">
          <defs>
            <linearGradient id="sac-degrade" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" class="s-fonce"/>
              <stop offset=".45" class="s-clair"/>
              <stop offset="1" class="s-fonce"/>
            </linearGradient>
          </defs>
          <line x1="60" y1="0" x2="60" y2="36" stroke="#c9c9d6" stroke-width="4" stroke-dasharray="7 3"/>
          <path d="M60 36 L38 54 M60 36 L82 54" stroke="#c9c9d6" stroke-width="2.5" fill="none"/>
          <rect x="34" y="50" width="52" height="10" rx="3" fill="#2a2a33"/>
          <rect x="18" y="56" width="84" height="214" rx="40" fill="url(#sac-degrade)"/>
          <rect x="18" y="118" width="84" height="30" fill="rgba(0,0,0,.35)"/>
          <text x="60" y="141" text-anchor="middle" class="sac-marque">BANGER</text>
          <rect x="30" y="76" width="10" height="170" rx="5" fill="#fff" opacity=".16"/>
          <path class="fissures" d="M74 64 L66 88 L78 100 L70 116 M36 170 L48 184 L42 200 L54 214 M88 196 L78 212 L86 228" stroke="rgba(0,0,0,.55)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
        </svg>
      </span>
      <img id="champion" alt="Le champion, en garde" draggable="false">
      <span id="effets" aria-hidden="true"></span>
      <span class="astuce" id="astuce">TAPE LE SAC · ou touche ESPACE</span>
    </button>

    <div class="combo-ligne">
      <div id="combo-texte">COMBO x0</div>
      <div class="barre"><i id="combo-barre"></i></div>
    </div>
    <div class="titre-rang">🏅 <span id="rang">Débutant du quartier</span><small id="rang-suivant"></small></div>
  </section>

  <section class="panneau" id="col-boutique">
    <h2>🛒 LA BOUTIQUE</h2>
    <div id="boutique"></div>
    <h2>📊 STATS</h2>
    <dl id="stats"></dl>
    <button class="btn-reset" id="reset" type="button">Recommencer à zéro</button>
  </section>
</main>

<p class="note">Ta progression est gardée sur cet appareil. Un coup sur 20 environ est un coup BANGER : ×5 likes et ×3 dégâts.</p>

<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
const CLE = 'empireBanger.boxe.v1';
const DELAI_COMBO = 800;
const $ = id => document.getElementById(id);
const calme = matchMedia('(prefers-reduced-motion: reduce)').matches;

// rangées par prix : l'ordre de la liste est l'ordre de la boutique
const AMELIOS = [
  { id: 'gants',    emoji: '🥊', nom: 'Gants renforcés',        desc: '+1 like et +1 dégât par coup',                    base: 15,     type: 'clic', val: 1 },
  { id: 'coach',    emoji: '📣', nom: 'Coach',                  desc: '+1 like/s : il crie « ENCORE ! » depuis le coin', base: 60,     type: 'auto', val: 1 },
  { id: 'corde',    emoji: '🪢', nom: 'Corde à sauter',         desc: '+5 likes/s',                                      base: 450,    type: 'auto', val: 5 },
  { id: 'sparring', emoji: '🤜', nom: 'Partenaire de sparring', desc: '+8 likes et +8 dégâts par coup',                  base: 1300,   type: 'clic', val: 8 },
  { id: 'salle',    emoji: '🏋️', nom: 'Salle de muscu',         desc: '+30 likes/s',                                     base: 5000,   type: 'auto', val: 30 },
  { id: 'ceinture', emoji: '🏆', nom: 'Ceinture en or',         desc: '×2 sur tous les likes et les dégâts',             base: 25000,  type: 'mult', val: 2, croissance: 12, max: 6 },
  { id: 'camera',   emoji: '📸', nom: 'Caméraman TikTok',       desc: '+140 likes/s : chaque entraînement devient une vidéo', base: 40000, type: 'auto', val: 140 },
  { id: 'uppercut', emoji: '💥', nom: 'Uppercut légendaire',    desc: '+60 likes et +60 dégâts par coup',                base: 90000,  type: 'clic', val: 60 },
  { id: 'zenith',   emoji: '🏟️', nom: 'Gala au Zénith',         desc: '+900 likes/s',                                    base: 450000, type: 'auto', val: 900 },
];
const TITRES = [
  [0, 'Débutant du quartier'], [100, 'Espoir du club'], [1e3, 'Boxeur amateur'], [1e4, 'Semi-pro'],
  [1e5, 'Boxeur pro'], [1e6, 'Champion régional'], [1e7, 'Champion de France'], [1e8, "Champion d'Europe"],
  [1e9, 'Champion du monde'], [1e10, 'Légende du ring'],
];
const SACS = [
  { nom: 'Sac rouge',  clair: '#ff5a6e', fonce: '#8e0f24' },
  { nom: 'Sac bleu',   clair: '#4fb4ff', fonce: '#0d3a78' },
  { nom: 'Sac vert',   clair: '#48e08a', fonce: '#0d5a33' },
  { nom: 'Sac violet', clair: '#c56bff', fonce: '#4a0f78' },
];
const BOSS = { nom: 'Sac en béton', clair: '#b9b9c2', fonce: '#3d3d48' };
const CRIS = ['POW!', 'BAM!', 'PAF!', 'BOUM!', 'VLAN!', 'TCHAK!'];

// ---------- calculs ----------
const niveau = id => etat.niveaux[id] || 0;
const mult = () => Math.pow(2, niveau('ceinture'));
const degats = () => (1 + AMELIOS.filter(a => a.type === 'clic').reduce((s, a) => s + a.val * niveau(a.id), 0)) * mult();
const lps = () => AMELIOS.filter(a => a.type === 'auto').reduce((s, a) => s + a.val * niveau(a.id), 0) * mult();
const estBoss = r => r % 5 === 0;
const sacDu = r => estBoss(r) ? BOSS : SACS[(r - 1) % SACS.length];
const pvMax = r => Math.round(12 * Math.pow(1.45, r - 1) * (estBoss(r) ? 3 : 1));
const prix = a => Math.ceil(a.base * Math.pow(a.croissance || 1.15, niveau(a.id)));
const multCombo = () => 1 + Math.min(combo, 50) * 0.04;

const UNITES = ['', ' k', ' M', ' Md', ' Bn', ' Bd', ' Tn'];
function fmt(n) {
  n = Math.floor(n);
  if (n < 100000) return n.toLocaleString('fr-FR');
  let i = 0;
  while (n >= 1000 && i < UNITES.length - 1) { n /= 1000; i++; }
  return n.toLocaleString('fr-FR', { maximumFractionDigits: n < 10 ? 2 : n < 100 ? 1 : 0 }) + UNITES[i];
}
const ecrire = (el, txt) => { if (el.textContent !== txt) el.textContent = txt; };

// ---------- sauvegarde ----------
const neuf = () => ({ likes: 0, total: 0, coups: 0, ko: 0, round: 1, pv: null, niveaux: {}, meilleurCombo: 0, titre: 0, son: true, t: Date.now() });
function charger() {
  try {
    const brut = localStorage.getItem(CLE);
    if (brut) return Object.assign(neuf(), JSON.parse(brut));
  } catch (e) {}
  return neuf();
}
function sauver() {
  etat.t = Date.now();
  try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {}
}

let etat = charger();
if (!(etat.pv > 0)) etat.pv = pvMax(etat.round);
let combo = 0, dernierCoup = 0, koEnCours = false;

function gagner(n) { etat.likes += n; etat.total += n; }

// ---------- son ----------
let audio = null, bruit = null;
function son(type) {
  if (!etat.son) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const t = audio.currentTime;
    const bip = (freq, fin, duree, vol, forme = 'sine', debut = 0) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = forme;
      o.frequency.setValueAtTime(freq, t + debut);
      if (fin) o.frequency.exponentialRampToValueAtTime(fin, t + debut + duree);
      g.gain.setValueAtTime(vol, t + debut);
      g.gain.exponentialRampToValueAtTime(0.0001, t + debut + duree);
      o.connect(g).connect(audio.destination);
      o.start(t + debut); o.stop(t + debut + duree + 0.02);
    };
    if (type === 'coup' || type === 'crit') {
      const fort = type === 'crit';
      bip(fort ? 200 : 160, 45, 0.15, fort ? 0.7 : 0.5);
      if (!bruit) {
        const n = audio.sampleRate * 0.07 | 0;
        bruit = audio.createBuffer(1, n, audio.sampleRate);
        const d = bruit.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      }
      const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
      src.buffer = bruit; f.type = 'lowpass'; f.frequency.value = fort ? 4000 : 1600; g.gain.value = fort ? 0.6 : 0.35;
      src.connect(f).connect(g).connect(audio.destination);
      src.start(t);
    } else if (type === 'ko') {
      bip(1320, 0, 0.9, 0.18, 'triangle');
      bip(1320, 0, 0.9, 0.18, 'triangle', 0.28);
    } else if (type === 'achat') {
      bip(660, 0, 0.08, 0.15, 'square');
      bip(990, 0, 0.12, 0.15, 'square', 0.07);
    } else if (type === 'non') {
      bip(180, 120, 0.15, 0.15, 'sawtooth');
    }
  } catch (e) {}
}

// ---------- effets ----------
const ring = $('ring'), sacWrap = $('sac-wrap'), sac = $('sac'), champion = $('champion'), effets = $('effets');

function toast(msg) {
  const box = $('toasts'), el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.classList.add('part'), 2600);
  setTimeout(() => el.remove(), 3000);
  while (box.childElementCount > 3) box.firstElementChild.remove();
}

function ajouterEffet(classe, x, y, texte) {
  const el = document.createElement('span');
  el.className = classe; el.textContent = texte;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  if (classe.startsWith('boum')) el.style.setProperty('--r', (Math.random() * 30 - 15).toFixed(0) + 'deg');
  effets.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
  while (effets.childElementCount > 40) effets.firstElementChild.remove();
}

function animerCoup(crit, gain) {
  if (!calme) {
    const d = crit ? 22 : 14;
    champion.animate([
      { transform: 'none' },
      { transform: `translate(-${d}px,-3px) rotate(-2.5deg) scale(1.02)`, offset: 0.35 },
      { transform: 'none' },
    ], { duration: crit ? 220 : 160, easing: 'ease-out' });
    // frappé depuis la droite, le bas du sac part vers la gauche : rotation dans le sens horaire
    sac.animate([
      { transform: 'rotate(0deg)' },
      { transform: `rotate(${crit ? 16 : 9}deg)` },
      { transform: `rotate(${crit ? -7 : -4}deg)` },
      { transform: 'rotate(0deg)' },
    ], { duration: crit ? 700 : 480, easing: 'ease-out' });
    if (crit) ring.animate([
      { transform: 'none' }, { transform: 'translate(-6px,3px)' }, { transform: 'translate(5px,-4px)' },
      { transform: 'translate(-3px,2px)' }, { transform: 'none' },
    ], { duration: 260 });
  }
  const r = ring.getBoundingClientRect(), s = sacWrap.getBoundingClientRect();
  const x = s.right - r.left - s.width * 0.15 + (Math.random() * 16 - 8);
  const y = s.top - r.top + s.height * (0.38 + Math.random() * 0.22);
  ajouterEffet(crit ? 'boum crit' : 'boum', x, y, crit ? 'BANGER !' : CRIS[Math.random() * CRIS.length | 0]);
  ajouterEffet(crit ? 'flottant crit' : 'flottant', x + 12, y - 24, '+' + fmt(gain));
}

function habillerSac() {
  const r = etat.round, s = sacDu(r), boss = estBoss(r);
  sacWrap.style.setProperty('--sac-clair', s.clair);
  sacWrap.style.setProperty('--sac-fonce', s.fonce);
  $('col-ring').classList.toggle('boss', boss);
  $('round').innerHTML = `ROUND ${r}${boss ? ' · 💀 BOSS' : ''}<small>${s.nom}</small>`;
}

// ---------- le coup ----------
function frapper() {
  const now = performance.now();
  combo = now - dernierCoup < DELAI_COMBO ? Math.min(combo + 1, 99) : 1;
  dernierCoup = now;
  const crit = Math.random() < (combo >= 20 ? 0.1 : 0.05);
  const gain = degats() * multCombo() * (crit ? 5 : 1);
  gagner(gain);
  etat.coups++;
  if (combo > etat.meilleurCombo) etat.meilleurCombo = combo;
  if (!koEnCours) etat.pv -= degats() * (crit ? 3 : 1);
  animerCoup(crit, gain);
  son(crit ? 'crit' : 'coup');
  if (!koEnCours && etat.pv <= 0) ko();
  $('astuce').hidden = true;
  demanderMaj();
}

function ko() {
  koEnCours = true;
  const r = etat.round, boss = estBoss(r);
  const recompense = Math.ceil(pvMax(r) * 4 * (boss ? 5 : 1)) * mult();
  gagner(recompense);
  etat.ko++;
  son('ko');
  const t = document.createElement('span');
  t.className = 'ko-texte'; t.textContent = 'K.O. !';
  effets.appendChild(t);
  t.addEventListener('animationend', () => t.remove());
  toast(`${boss ? '💀 Boss battu' : '🥊 K.O.'} au round ${r} ! +${fmt(recompense)} likes`);
  if (calme) {
    sacWrap.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' });
  } else {
    sacWrap.animate([
      { transform: 'none', opacity: 1 },
      { transform: 'translateY(30%) rotate(-18deg)', opacity: 0 },
    ], { duration: 600, easing: 'ease-in', fill: 'forwards' });
    champion.animate([
      { transform: 'none' }, { transform: 'translateY(-16px)' }, { transform: 'none' },
      { transform: 'translateY(-10px)' }, { transform: 'none' },
    ], { duration: 700, delay: 120 });
  }
  setTimeout(() => {
    etat.round++;
    etat.pv = pvMax(etat.round);
    habillerSac();
    sacWrap.getAnimations().forEach(a => a.cancel());
    if (!calme) sacWrap.animate([{ transform: 'translateY(-105%)' }, { transform: 'none' }], { duration: 500, easing: 'cubic-bezier(.3,1.5,.5,1)' });
    koEnCours = false;
    demanderMaj();
    sauver();
  }, 950);
}

// ---------- boutique ----------
const noeuds = {};
function construireBoutique() {
  const box = $('boutique');
  for (const a of AMELIOS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'amelio'; b.dataset.id = a.id;
    b.innerHTML = `<span class="ico" aria-hidden="true">${a.emoji}</span>
      <span><span class="nom">${a.nom}</span><span class="desc">${a.desc}</span></span>
      <span class="cote"><span class="prix"></span><span class="niv"></span></span>`;
    box.appendChild(b);
    noeuds[a.id] = { b, prix: b.querySelector('.prix'), niv: b.querySelector('.niv') };
  }
  const v = document.createElement('div');
  v.className = 'verrou'; v.id = 'verrou';
  box.appendChild(v);
  box.addEventListener('click', e => {
    const b = e.target.closest('.amelio');
    if (b) acheter(b.dataset.id);
  });
}

function acheter(id) {
  const a = AMELIOS.find(x => x.id === id);
  if (!a || (a.max && niveau(id) >= a.max)) return;
  const p = prix(a);
  if (etat.likes < p) { son('non'); return; }
  etat.likes -= p;
  etat.niveaux[id] = niveau(id) + 1;
  son('achat');
  if (!calme) noeuds[id].b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.03)' }, { transform: 'scale(1)' }], { duration: 200 });
  if (id === 'ceinture') toast(`🏆 Ceinture en or n°${niveau(id)} : likes et dégâts ×${fmt(mult())} !`);
  demanderMaj();
  sauver();
}

function majBoutique() {
  let prochain = null;
  for (const a of AMELIOS) {
    const n = noeuds[a.id], niv = niveau(a.id);
    const visible = niv > 0 || etat.total >= a.base * 0.5;
    n.b.hidden = !visible;
    if (!visible) { prochain = prochain || a; continue; }
    const auMax = a.max && niv >= a.max;
    const p = prix(a);
    const peut = !auMax && etat.likes >= p;
    ecrire(n.prix, auMax ? 'MAX' : fmt(p));
    ecrire(n.niv, auMax ? `niv. ${niv}` : niv ? `niv. ${niv}` : 'nouveau');
    n.b.classList.toggle('pret', peut);
    n.b.classList.toggle('cher', !peut);
    n.b.setAttribute('aria-disabled', String(!peut));
  }
  const v = $('verrou');
  v.hidden = !prochain;
  if (prochain) ecrire(v, `🔒 Prochaine amélioration quand tu auras gagné ${fmt(prochain.base * 0.5)} likes au total`);
}

// ---------- stats ----------
const STATS = [
  ['Coups donnés', () => fmt(etat.coups)],
  ['Sacs mis K.O.', () => fmt(etat.ko)],
  ['Meilleur combo', () => 'x' + etat.meilleurCombo],
  ['Dégâts par coup', () => fmt(degats())],
  ['Round atteint', () => String(etat.round)],
  ['Likes gagnés au total', () => fmt(etat.total)],
];
const ddStats = STATS.map(([nom]) => {
  const dt = document.createElement('dt'), dd = document.createElement('dd');
  dt.textContent = nom;
  $('stats').append(dt, dd);
  return dd;
});

// ---------- affichage ----------
let majPrevue = false;
function demanderMaj() {
  if (majPrevue) return;
  majPrevue = true;
  requestAnimationFrame(maj);
}
function maj() {
  majPrevue = false;
  const l = lps();
  ecrire($('likes'), fmt(etat.likes));
  ecrire($('lps'), `${fmt(l)} like${l >= 2 ? 's' : ''}/s · ${fmt(degats())} par coup`);

  const max = pvMax(etat.round), pv = Math.max(0, etat.pv);
  $('pv-barre').style.width = (pv / max * 100) + '%';
  ecrire($('pv-texte'), `${fmt(Math.ceil(pv))} / ${fmt(max)}`);
  $('pv').setAttribute('aria-valuenow', String(Math.round(pv / max * 100)));

  const reste = combo ? Math.max(0, 1 - (performance.now() - dernierCoup) / DELAI_COMBO) : 0;
  ecrire($('combo-texte'), combo ? `COMBO x${combo} · ×${multCombo().toFixed(2).replace('.', ',')}` : 'COMBO x0');
  $('combo-barre').style.width = (reste * 100) + '%';

  let i = 0;
  while (i + 1 < TITRES.length && etat.total >= TITRES[i + 1][0]) i++;
  ecrire($('rang'), TITRES[i][1]);
  ecrire($('rang-suivant'), TITRES[i + 1] ? `Prochain titre : ${TITRES[i + 1][1]} à ${fmt(TITRES[i + 1][0])} likes gagnés` : 'Titre maximum atteint 👑');
  if (i > etat.titre) { etat.titre = i; toast(`🏅 Nouveau titre : ${TITRES[i][1]} !`); }

  majBoutique();
  STATS.forEach(([, val], k) => ecrire(ddStats[k], val()));
}

// ---------- commandes ----------
ring.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  frapper();
});
// clavier et lecteurs d'écran : leurs clics ont detail = 0 (les clics souris/doigt sont déjà gérés au pointerdown)
ring.addEventListener('click', e => {
  if (audio && audio.state === 'suspended') audio.resume();
  if (e.detail === 0) frapper();
});
// garder Entrée enfoncée ne doit pas devenir un autoclicker
ring.addEventListener('keydown', e => { if (e.repeat && (e.key === 'Enter' || e.key === ' ')) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.repeat || e.target !== document.body) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); frapper(); }
});
ring.addEventListener('contextmenu', e => e.preventDefault());

function majBoutonSon() {
  const b = $('btn-son');
  b.textContent = etat.son ? '🔊' : '🔇';
  b.setAttribute('aria-pressed', String(etat.son));
  b.title = etat.son ? 'Couper le son' : 'Remettre le son';
}
$('btn-son').addEventListener('click', () => { etat.son = !etat.son; majBoutonSon(); sauver(); });

let armeReset = null;
$('reset').addEventListener('click', () => {
  const b = $('reset');
  const desarmer = () => { armeReset = null; b.textContent = 'Recommencer à zéro'; b.classList.remove('arme'); };
  if (!armeReset) {
    b.textContent = 'Sûr ? Touche encore pour tout effacer';
    b.classList.add('arme');
    armeReset = setTimeout(desarmer, 3000);
    return;
  }
  clearTimeout(armeReset);
  desarmer();
  const sonActif = etat.son;
  etat = neuf();
  etat.son = sonActif;
  etat.pv = pvMax(1);
  combo = 0;
  habillerSac();
  sauver();
  demanderMaj();
  toast('🔄 Nouvelle carrière : retour au round 1');
});

// ---------- démarrage ----------
construireBoutique();
habillerSac();
majBoutonSon();

// l'équipe continue de bosser quand le jeu est fermé (3 h maximum)
const absence = Math.min((Date.now() - etat.t) / 1000, 3 * 3600);
const gainAbsence = lps() * absence;
if (absence > 30 && gainAbsence >= 1) {
  gagner(gainAbsence);
  setTimeout(() => toast(`💤 Pendant ton absence, l'équipe a fait +${fmt(gainAbsence)} likes`), 400);
}

let dernierTick = performance.now();
setInterval(() => {
  const now = performance.now();
  const dt = Math.min((now - dernierTick) / 1000, 3 * 3600);
  dernierTick = now;
  const l = lps();
  if (l > 0) gagner(l * dt);
  if (combo && now - dernierCoup > DELAI_COMBO) combo = 0;
  demanderMaj();
}, 100);
setInterval(sauver, 5000);
addEventListener('pagehide', sauver);
document.addEventListener('visibilitychange', () => { if (document.hidden) sauver(); });
maj();
</script>
