<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algator37 - Le Jeu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .score-display {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .score-label {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .score {
            font-size: 3em;
            color: #667eea;
            font-weight: bold;
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
        }

        button:active {
            transform: scale(0.95);
        }

        .click-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.2em;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.1s;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .click-btn:hover {
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .click-btn:active {
            transform: scale(0.98);
        }

        .emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .upgrade-btn {
            background: #4CAF50;
            color: white;
            width: 100%;
        }

        .upgrade-btn:hover {
            background: #45a049;
        }

        .upgrade-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .stats {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }

        .stat-line {
            margin: 5px 0;
        }

        .multiplier {
            color: #667eea;
            font-weight: bold;
        }

        .floating-text {
            position: fixed;
            pointer-events: none;
            font-weight: bold;
            color: #667eea;
            animation: float-up 1s ease-out forwards;
            font-size: 1.2em;
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px);
            }
        }

        .reset-btn {
            background: #ff6b6b;
            color: white;
            width: 100%;
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: #ff5252;
        }

        .title-accent {
            color: #764ba2;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #999;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .character {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #eee;
            transition: all 0.3s;
            cursor: pointer;
        }

        .character:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .character span {
            font-size: 2em;
            display: block;
            margin-bottom: 5px;
        }

        .character p {
            color: #666;
            font-size: 0.85em;
            margin: 0;
        }

        .bonus-display {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ALGATOR<span class="title-accent">37</span></h1>
        <p class="subtitle">L'Empire Banger - Édition Clicker</p>

        <div class="score-display">
            <div class="score-label">EMPIRE POINTS</div>
            <div class="score" id="score">0</div>
        </div>

        <div id="bonus" class="bonus-display" style="display:none;">
            <span id="bonusText">🎉 BONUS! x5 pendant 10s</span>
        </div>

        <button class="click-btn" id="clickBtn">
            <div class="emoji" id="emoji">🐊</div>
            <div>CLIQUE SUR ALGATOR!</div>
        </button>

        <div class="tabs">
            <button class="tab-btn active" data-tab="upgrades">Améliorations</button>
            <button class="tab-btn" data-tab="perks">Personnages</button>
        </div>

        <div id="upgrades" class="tab-content active">
            <div class="button-container">
                <button class="upgrade-btn" id="upgrade1">
                    👆 Force<br><span id="cost1">10 pts</span>
                </button>
                <button class="upgrade-btn" id="upgrade2">
                    🚀 Multiplicateur<br><span id="cost2">50 pts</span>
                </button>
            </div>
            <div class="button-container">
                <button class="upgrade-btn" id="upgrade3">
                    ⚡ Clic auto<br><span id="cost3">200 pts</span>
                </button>
                <button class="upgrade-btn" id="upgrade4">
                    💰 Jackpot<br><span id="cost4">500 pts</span>
                </button>
            </div>
        </div>

        <div id="perks" class="tab-content" style="display:none;">
            <div class="character-grid">
                <div class="character">
                    <span>🐊</span>
                    <p>Algator</p>
                </div>
                <div class="character">
                    <span>🦈</span>
                    <p>Sharkz_29</p>
                </div>
                <div class="character">
                    <span>👑</span>
                    <p>Lagator</p>
                </div>
                <div class="character">
                    <span>🎵</span>
                    <p>Musicien</p>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-line">💪 Force: <span class="multiplier" id="power">1</span></div>
            <div class="stat-line">📈 Multiplicateur: <span class="multiplier" id="multiplier">x1</span></div>
            <div class="stat-line">🤖 Clics auto/s: <span class="multiplier" id="autoclick">0</span></div>
            <div class="stat-line">Niveau: <span class="multiplier" id="level">1</span></div>
        </div>

        <button class="reset-btn" id="resetBtn">🔄 RECOMMENCER</button>
    </div>

    <script>
        let score = 0;
        let clickPower = 1;
        let multiplier = 1;
        let autoClickPower = 0;
        let level = 1;
        let upgradeCount = 0;
        let bonusActive = false;
        let bonusMultiplier = 1;

        let upgrade1Cost = 10;
        let upgrade2Cost = 50;
        let upgrade3Cost = 200;
        let upgrade4Cost = 500;

        const upgrade1BaseCost = 10;
        const upgrade2BaseCost = 50;
        const upgrade3BaseCost = 200;
        const upgrade4BaseCost = 500;

        const scoreDisplay = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');
        const emoji = document.getElementById('emoji');
        const resetBtn = document.getElementById('resetBtn');
        const powerDisplay = document.getElementById('power');
        const multiplierDisplay = document.getElementById('multiplier');
        const autoClickDisplay = document.getElementById('autoclick');
        const levelDisplay = document.getElementById('level');
        const bonusDisplay = document.getElementById('bonus');

        const emojis = ['🐊', '🎮', '🎵', '⚡', '🌟', '💰', '🔥', '👑', '🎪', '🚀'];
        let emojiIndex = 0;

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.getAttribute('data-tab');
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(tab).classList.add('active');
            });
        });

        function updateDisplay() {
            scoreDisplay.textContent = Math.floor(score);
            powerDisplay.textContent = Math.floor(clickPower * multiplier);
            multiplierDisplay.textContent = 'x' + multiplier;
            autoClickDisplay.textContent = Math.floor(autoClickPower / 10);
            levelDisplay.textContent = level;

            const buttons = ['upgrade1', 'upgrade2', 'upgrade3', 'upgrade4'];
            const costs = [upgrade1Cost, upgrade2Cost, upgrade3Cost, upgrade4Cost];

            buttons.forEach((id, i) => {
                document.getElementById(id).disabled = score < costs[i];
                document.getElementById('cost' + (i + 1)).textContent = Math.floor(costs[i]) + ' pts';
            });
        }

        function floatingText(text, x, y) {
            const span = document.createElement('div');
            span.className = 'floating-text';
            span.textContent = text;
            span.style.left = x + 'px';
            span.style.top = y + 'px';
            document.body.appendChild(span);
            setTimeout(() => span.remove(), 1000);
        }

        function activateBonus() {
            if (!bonusActive && Math.random() < 0.05) {
                bonusActive = true;
                bonusMultiplier = 5;
                bonusDisplay.style.display = 'block';
                setTimeout(() => {
                    bonusActive = false;
                    bonusMultiplier = 1;
                    bonusDisplay.style.display = 'none';
                }, 10000);
            }
        }

        clickBtn.addEventListener('click', (e) => {
            activateBonus();
            const points = (clickPower * multiplier * bonusMultiplier);
            score += points;

            floatingText('+' + Math.floor(points), e.clientX, e.clientY);

            emojiIndex = (emojiIndex + 1) % emojis.length;
            emoji.textContent = emojis[emojiIndex];

            clickBtn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                clickBtn.style.transform = 'scale(1)';
            }, 100);

            updateDisplay();
        });

        document.getElementById('upgrade1').addEventListener('click', () => {
            if (score >= upgrade1Cost) {
                score -= upgrade1Cost;
                clickPower += 1;
                upgradeCount++;
                level = Math.floor(1 + upgradeCount / 3);
                upgrade1Cost = upgrade1BaseCost * Math.pow(1.15, upgradeCount / 2);
                updateDisplay();
            }
        });

        document.getElementById('upgrade2').addEventListener('click', () => {
            if (score >= upgrade2Cost) {
                score -= upgrade2Cost;
                multiplier *= 1.5;
                upgradeCount++;
                level = Math.floor(1 + upgradeCount / 3);
                upgrade2Cost = upgrade2BaseCost * Math.pow(1.2, Math.floor(upgradeCount / 2));
                updateDisplay();
            }
        });

        document.getElementById('upgrade3').addEventListener('click', () => {
            if (score >= upgrade3Cost) {
                score -= upgrade3Cost;
                autoClickPower += 1;
                upgradeCount++;
                level = Math.floor(1 + upgradeCount / 3);
                upgrade3Cost = upgrade3BaseCost * Math.pow(1.25, Math.floor(upgradeCount / 3));
                updateDisplay();
            }
        });

        document.getElementById('upgrade4').addEventListener('click', () => {
            if (score >= upgrade4Cost) {
                score -= upgrade4Cost;
                score += Math.floor(score * 0.5);
                upgradeCount++;
                level = Math.floor(1 + upgradeCount / 3);
                upgrade4Cost = upgrade4BaseCost * Math.pow(1.3, Math.floor(upgradeCount / 3));
                updateDisplay();
            }
        });

        // Auto-clic
        setInterval(() => {
            if (autoClickPower > 0) {
                activateBonus();
                const points = (autoClickPower / 10) * bonusMultiplier;
                score += points;
                updateDisplay();
            }
        }, 1000);

        resetBtn.addEventListener('click', () => {
            if (confirm('Êtes-vous sûr? Tous vos progrès seront perdus.')) {
                score = 0;
                clickPower = 1;
                multiplier = 1;
                autoClickPower = 0;
                level = 1;
                upgradeCount = 0;
                bonusActive = false;
                bonusMultiplier = 1;
                upgrade1Cost = upgrade1BaseCost;
                upgrade2Cost = upgrade2BaseCost;
                upgrade3Cost = upgrade3BaseCost;
                upgrade4Cost = upgrade4BaseCost;
                emojiIndex = 0;
                emoji.textContent = '🐊';
                bonusDisplay.style.display = 'none';
                updateDisplay();
            }
        });

        updateDisplay();
    </script>
</body>
</html>
